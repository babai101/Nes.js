<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nes.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
    <link rel="stylesheet" href="/public/css/style.css">
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1 class="wordmark">Nes.js</h1>
            <p class="tagline">An NES emulator written in JavaScript</p>
        </div>
        <label class="game-picker">
            <span class="game-picker__label">Game</span>
            <select id="romSelect">
                <option value="select" selected disabled>Choose a game</option>
            </select>
        </label>
    </header>

    <main class="stage" id="stage">
        <div class="bezel">
            <div class="screen">
                <canvas id="nesCanvas" width="256" height="224" class="mainCanvas"></canvas>
                <p class="screen__empty" id="emptyState">Choose a game from the list above to start playing.</p>
            </div>
            <div class="bezel__strip">
                <p class="status" id="status"><span class="status__led" aria-hidden="true"></span><span id="statusText">No game loaded</span></p>
                <div class="scale-toggle" role="group" aria-label="Screen size">
                    <button type="button" data-scale="fit">Fit</button>
                    <button type="button" data-scale="1">1x</button>
                    <button type="button" data-scale="2">2x</button>
                    <button type="button" data-scale="3">3x</button>
                    <button type="button" data-scale="4">4x</button>
                </div>
            </div>
        </div>

        <section class="keymap" aria-labelledby="keymapTitle">
            <h2 id="keymapTitle" class="keymap__title">Keyboard controls</h2>
            <div class="pad">
                <div class="pad__group">
                    <div class="dpad" aria-hidden="true"><span></span><span></span></div>
                    <p class="pad__caption">D-pad <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></p>
                </div>
                <div class="pad__group pad__group--menu">
                    <div class="pill-pair">
                        <div><span class="pill" aria-hidden="true"></span><p class="pad__caption">Select <kbd>Space</kbd></p></div>
                        <div><span class="pill" aria-hidden="true"></span><p class="pad__caption">Start <kbd>Ctrl</kbd></p></div>
                    </div>
                </div>
                <div class="pad__group">
                    <div class="face-pair">
                        <div><span class="face" aria-hidden="true">B</span><p class="pad__caption"><kbd>X</kbd></p></div>
                        <div><span class="face" aria-hidden="true">A</span><p class="pad__caption"><kbd>Z</kbd></p></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.2.1.min.js"
        integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
    <script>
        // Screen size toggle: Fit / 1x / 2x / 3x / 4x.
        // Nx means 224*N CSS pixels tall; width follows the 8:7 NTSC pixel
        // aspect ratio (256 * 8/7 * N = 292.57 * N) via aspect-ratio in CSS.
        (function () {
            var stage = document.getElementById('stage');
            var buttons = document.querySelectorAll('.scale-toggle button');

            function setScale(scale) {
                if (scale === 'fit') {
                    stage.style.removeProperty('--screen-w');   // fall back to the stylesheet
                } else {
                    var n = Number(scale);
                    // unrounded so the height is exactly 224*n
                    stage.style.setProperty('--screen-w', (256 * 8 / 7 * n) + 'px');
                }
                buttons.forEach(function (b) {
                    b.classList.toggle('active', b.dataset.scale === String(scale));
                });
                try { localStorage.setItem('nesScale', scale); } catch (e) {}
            }

            buttons.forEach(function (b) {
                b.addEventListener('click', function () {
                    setScale(b.dataset.scale);
                    b.blur();   // keep keyboard focus off the button so Z/X/Space reach the game
                });
            });

            var saved = 'fit';
            try { saved = localStorage.getItem('nesScale') || 'fit'; } catch (e) {}
            setScale(saved);
        })();
    </script>
    <script type="text/javascript" src="/public/build/nes-emu.js"></script>
    <script>
        /*global $*/
        $(document).ready(function () {
            var nes = new NES();
            var requestId = 0;
            var fps = 60, fpsInterval, startTime, now, then, elapsed;
            
            function renderFrame() {
                // requestId = nes.renderFrame();
                
                requestId = requestAnimationFrame(renderFrame);
                // if enough time has elapsed, draw the next frame
                now = Date.now();
                elapsed = now - then;
                if (elapsed > fpsInterval) {

                    // Get ready for next frame by setting then=now, but also adjust for your
                    // specified fpsInterval not being a multiple of RAF's interval (16.7ms)
                    then = now - (elapsed % fpsInterval);

                    // Put your drawing code here
                    nes.renderFrame();
                }
            }
            //KeyPress events
            $(window).keydown(function (e) {
                var key = e.which;
                //do stuff with "key" here...
                switch (key) {
                    //Start
                    case 17:
                        nes.MMU.startBtnState = 1;
                        break;
                    //A
                    case 90:
                        nes.MMU.aBtnState = 1;
                        break;
                    //B
                    case 88:
                        nes.MMU.bBtnState = 1;
                        break;
                    //Up
                    case 38:
                        nes.MMU.upBtnState = 1;
                        break;
                    //Down
                    case 40:
                        nes.MMU.downBtnState = 1;
                        break;
                    //Left
                    case 37:
                        nes.MMU.leftBtnState = 1;
                        break;
                    //Right
                    case 39:
                        nes.MMU.rightBtnState = 1;
                        break;
                    case 32:
                        nes.MMU.selectBtnState = 1;
                        break;
                }
            });


            $(window).keyup(function (e) {
                var key = e.which;
                //do stuff with "key" here...
                switch (key) {
                    //Start
                    case 17:
                        nes.MMU.startBtnState = 0;
                        break;
                    //A
                    case 90:
                        nes.MMU.aBtnState = 0;
                        break;
                    //B
                    case 88:
                        nes.MMU.bBtnState = 0;
                        break;
                    //Up
                    case 38:
                        nes.MMU.upBtnState = 0;
                        break;
                    //Down
                    case 40:
                        nes.MMU.downBtnState = 0;
                        break;
                    //Left
                    case 37:
                        nes.MMU.leftBtnState = 0;
                        break;
                    //Right
                    case 39:
                        nes.MMU.rightBtnState = 0;
                        break;
                    case 32:
                        nes.MMU.selectBtnState = 0;
                        break;
                }
            });
            function loadRomsToDropdown() {
                var url = '/api/getPlayableRoms';
                var $dropdown = $('#romDropdown');
                $.ajax({
                    type: 'GET',
                    url: url,
                    success: function (result) {
                        var $dropdown = $("#romSelect");
                        $.each(result.roms, function () {
                            $dropdown.append($("<option />").val(this.file).text(this.name));
                        });
                    },
                    error: function (e) {
                        console.log(e);
                    }
                });
            }
            //Click events
            $('#pause').click(function () {
                // isPaused = !isPaused;
            });
            $('#reset').click(function () {
                nes.reset();
            });
            // $('#btnSearchRoms').click(function() {
            //     var url = "/api/getRomListByName/" + $('#inpSearchRoms').val();
            //     $('#inpSearchRoms').popover('enable');
            //     $('#inpSearchRoms').popover('show');
            //     $.ajax({
            //         type: 'GET',
            //         url: url,
            //         success: function(result) {
            //             $('.popover-body').append("<h5 id='loadedRomName'>" + result.rom + "</h5>" + "<button id='loadRom' type='button' class='btn btn-primary'>Load</button>");
            //         },
            //         error: function(e) {
            //             console.log(e);
            //         }
            //     });
            // });

            // $('body').on('click', '#loadRom', function() {
            //     //Now load the selected rom into browser memory
            //     var url = "/api/getRomByFileName/" + $('#loadedRomName').text();
            //     $.ajax({
            //         type: 'GET',
            //         url: url,
            //         success: function(result) {
            //             $('#inpSearchRoms').popover('dispose');
            //             nes.initGame(result.romData.data);
            //             requestAnimationFrame(nes.renderFrame);
            //         },
            //         error: function(e) {
            //             console.log(e);
            //         }
            //     });

            // });

            // $('body').on('click', '#btnLoadROM', function() {
            $('body').on('change', '#romSelect', function () {
                //Now load the selected rom into browser memory
                var url = "/api/getRomByFileName/" + $(this).val();
                $.ajax({
                    type: 'GET',
                    url: url,
                    success: function (result) {
                        cancelAnimationFrame(requestId);
                        if (nes.isRunning)
                            nes.reset();
                        nes.initGame(result.romData.data);
                        fpsInterval = 1000 / fps;
                        then = Date.now();
                        startTime = then
                        requestId = requestAnimationFrame(renderFrame);
                        $('#romSelect').blur();
                        $('#emptyState').prop('hidden', true);
                        $('#status').addClass('is-on');
                        $('#statusText').text($('#romSelect option:selected').text());
                    },
                    error: function (e) {
                        console.log(e);
                    }
                });

            });
            loadRomsToDropdown();
        });
    </script>
</body>

</html>
